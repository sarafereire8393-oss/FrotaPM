<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço - FrotaPM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">🚗 FrotaPM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="viaturas.html">Viaturas</a></li>
                    <li class="nav-item"><a class="nav-link" href="manutencao.html">Manutenção</a></li>
                    <li class="nav-item"><a class="nav-link" href="rastreamento.html">Rastreamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="relatorios.html">Relatórios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ordens-servico.html">Ordens</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="logout()" style="cursor: pointer;">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-dashboard container-fluid py-5">
        <div class="row mb-4">
            <div class="col-lg-8"><h1>Ordens de Serviço</h1></div>
            <div class="col-lg-4 text-end"><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalOrdem">+ Nova Ordem</button></div>
        </div>

        <div class="card">
            <div class="card-header"><h5>Ordens Registradas</h5></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Viatura</th>
                                <th>Problema</th>
                                <th>Mecânico</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-ordens">
                            <tr><td colspan="7" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalOrdem" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Ordem de Serviço</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-ordem">
                        <div class="mb-3">
                            <label for="ordem-viatura" class="form-label">Viatura *</label>
                            <select class="form-select" id="ordem-viatura" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="ordem-problema" class="form-label">Problema *</label>
                            <textarea class="form-control" id="ordem-problema" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="ordem-mecanico" class="form-label">Mecânico</label>
                            <input type="text" class="form-control" id="ordem-mecanico">
                        </div>
                        <div class="mb-3">
                            <label for="ordem-status" class="form-label">Status</label>
                            <select class="form-select" id="ordem-status">
                                <option value="aberta">Aberta</option>
                                <option value="em_progresso">Em Progresso</option>
                                <option value="fechada">Fechada</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarOrdem">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer><p>&copy; 2024 FrotaPM - Gestão de Frotas | SENAI/SC - Blumenau</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ordens-servico.js"></script>
</body>
</html>
